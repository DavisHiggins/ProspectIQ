[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prospectiq"
dynamic = ["version"]
description = "Open-source lead intelligence that turns public profiles into structured, traceable, locally controlled records."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Davis Higgins" }]
maintainers = [{ name = "Davis Higgins" }]
keywords = [
    "lead-generation",
    "lead-intelligence",
    "contact-enrichment",
    "data-enrichment",
    "email-verification",
    "osint",
    "cli",
    "data-pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

# Single source of dependency truth. requirements.txt installs this project.
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "dnspython>=2.4.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
proxy = ["free-proxy>=1.1.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "Pillow>=10.0",
    "types-requests>=2.31",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/davishiggins/prospectiq"
Repository = "https://github.com/davishiggins/prospectiq"
Issues = "https://github.com/davishiggins/prospectiq/issues"
Changelog = "https://github.com/davishiggins/prospectiq/blob/main/CHANGELOG.md"
Portfolio = "https://davishiggins.com"

[project.scripts]
prospectiq = "prospectiq.cli:main"

[tool.hatch.version]
path = "prospectiq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["prospectiq"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "ARG",  # unused arguments
    "TID",  # tidy imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "B008",    # function calls in argument defaults
    "RUF012",  # mutable class attrs need ClassVar; noisy for plain data
]

[tool.ruff.lint.per-file-ignores]
# Test doubles routinely accept and ignore arguments to match a real signature.
"tests/*" = ["ARG001", "ARG002", "ARG005", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["prospectiq"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that require live network access (deselected by default in CI)",
]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build/", "dist/"]
# CI type-checks the package only; tests use fixtures that defeat strict inference.
files = ["prospectiq"]

[tool.coverage.run]
source = ["prospectiq"]
omit = ["prospectiq/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
