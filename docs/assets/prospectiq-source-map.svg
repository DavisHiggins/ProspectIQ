<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
  <title id="title">ProspectIQ supported source map</title>
  <desc id="desc">Eight source categories feed a shared source registry and normalized lead schema.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001019"/>
      <stop offset="1" stop-color="#0E272F"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#225E6A"/>
      <stop offset="0.52" stop-color="#2999A3"/>
      <stop offset="1" stop-color="#C9B171"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#143D49" stroke-width="1" opacity=".35"/>
    </pattern>
    <style>
      .label { font: 700 17px system-ui, sans-serif; letter-spacing: 2px; fill: #F5F8FA; }
      .small { font: 500 14px system-ui, sans-serif; fill: #8FA5B0; }
      .eyebrow { font: 700 13px system-ui, sans-serif; letter-spacing: 3px; fill: #C9B171; }
      .title { font: 700 28px system-ui, sans-serif; fill: #F5F8FA; }
      .card { fill: #0E272F; stroke: #225E6A; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#canvas)"/>
  <rect width="100%" height="100%" rx="20" fill="url(#grid)"/>
  <text x="72" y="62" class="eyebrow">SUPPORTED SOURCES</text>
  <text x="72" y="102" class="title">Eight adapters. One normalized contract.</text>
  <rect x="72" y="146" width="304" height="94" rx="14" class="card"/>
  <circle cx="102" cy="193" r="8" fill="#2999A3"/>
  <text x="124" y="186" class="label">INSTAGRAM</text>
  <text x="124" y="212" class="small">public profiles</text>
  <rect x="412" y="146" width="304" height="94" rx="14" class="card"/>
  <circle cx="442" cy="193" r="8" fill="#2999A3"/>
  <text x="464" y="186" class="label">TIKTOK</text>
  <text x="464" y="212" class="small">creator profiles</text>
  <rect x="752" y="146" width="304" height="94" rx="14" class="card"/>
  <circle cx="782" cy="193" r="8" fill="#C9B171"/>
  <text x="804" y="186" class="label">LINKEDIN</text>
  <text x="804" y="212" class="small">own session required</text>
  <rect x="1092" y="146" width="304" height="94" rx="14" class="card"/>
  <circle cx="1122" cy="193" r="8" fill="#2999A3"/>
  <text x="1144" y="186" class="label">GITHUB</text>
  <text x="1144" y="212" class="small">public API</text>
  <rect x="72" y="268" width="304" height="94" rx="14" class="card"/>
  <circle cx="102" cy="315" r="8" fill="#2999A3"/>
  <text x="124" y="308" class="label">YOUTUBE</text>
  <text x="124" y="334" class="small">channels</text>
  <rect x="412" y="268" width="304" height="94" rx="14" class="card"/>
  <circle cx="442" cy="315" r="8" fill="#2999A3"/>
  <text x="464" y="308" class="label">TWITCH</text>
  <text x="464" y="334" class="small">public channels</text>
  <rect x="752" y="268" width="304" height="94" rx="14" class="card"/>
  <circle cx="782" cy="315" r="8" fill="#2999A3"/>
  <text x="804" y="308" class="label">PINTEREST</text>
  <text x="804" y="334" class="small">public profiles</text>
  <rect x="1092" y="268" width="304" height="94" rx="14" class="card"/>
  <circle cx="1122" cy="315" r="8" fill="#2999A3"/>
  <text x="1144" y="308" class="label">LINK-IN-BIO</text>
  <text x="1144" y="334" class="small">four providers</text>
</svg>
