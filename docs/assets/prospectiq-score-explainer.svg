<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">ProspectIQ scoring and provenance</title>
  <desc id="desc">Record completeness creates the lead score while email evidence records source, confidence, and verification separately.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001019"/>
      <stop offset="1" stop-color="#0E272F"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#225E6A"/>
      <stop offset="0.52" stop-color="#2999A3"/>
      <stop offset="1" stop-color="#C9B171"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#143D49" stroke-width="1" opacity=".35"/>
    </pattern>
    <style>
      .label { font: 700 17px system-ui, sans-serif; letter-spacing: 2px; fill: #F5F8FA; }
      .small { font: 500 14px system-ui, sans-serif; fill: #8FA5B0; }
      .eyebrow { font: 700 13px system-ui, sans-serif; letter-spacing: 3px; fill: #C9B171; }
      .title { font: 700 28px system-ui, sans-serif; fill: #F5F8FA; }
      .card { fill: #0E272F; stroke: #225E6A; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#canvas)"/>
  <rect width="100%" height="100%" rx="20" fill="url(#grid)"/>
  <text x="72" y="62" class="eyebrow">SCORING + PROVENANCE</text>
  <text x="72" y="102" class="title">Two signals, kept deliberately separate</text>
  <rect x="72" y="148" width="620" height="300" rx="18" class="card"/>
  <text x="108" y="196" class="label">RECORD COMPLETENESS → LEAD SCORE</text>
  <text x="108" y="228" class="small">How actionable and complete is this record?</text>
  <path d="M128 295H622" stroke="#143D49" stroke-width="16" stroke-linecap="round"/>
  <path d="M128 295H512" stroke="#2999A3" stroke-width="16" stroke-linecap="round"/>
  <circle cx="512" cy="295" r="13" fill="#C9B171" filter="url(#glow)"/>
  <text x="108" y="352" class="small">email  +  phone  +  website  +  company  +  audience signals</text>
  <text x="108" y="398" class="eyebrow">NOT PURCHASE INTENT</text>
  <rect x="748" y="148" width="620" height="300" rx="18" class="card"/>
  <text x="784" y="196" class="label">EMAIL CANDIDATE → EVIDENCE</text>
  <text x="784" y="228" class="small">What was observed, inferred, or confirmed?</text>
  <rect x="784" y="266" width="244" height="54" rx="9" fill="#143D49"/>
  <text x="804" y="299" class="small">email_source</text>
  <rect x="1044" y="266" width="286" height="54" rx="9" fill="#143D49"/>
  <text x="1064" y="299" class="small">email_confidence</text>
  <rect x="784" y="336" width="244" height="54" rx="9" fill="#143D49"/>
  <text x="804" y="369" class="small">email_verified</text>
  <rect x="1044" y="336" width="286" height="54" rx="9" fill="#143D49"/>
  <text x="1064" y="369" class="small">unconfirmed ≠ invalid</text>
</svg>
