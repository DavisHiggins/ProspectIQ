<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">ProspectIQ architecture</title>
  <desc id="desc">The CLI routes through the source registry and scrapers into normalization, enrichment, candidate selection, scoring, and CSV export.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001019"/>
      <stop offset="1" stop-color="#0E272F"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#225E6A"/>
      <stop offset="0.52" stop-color="#2999A3"/>
      <stop offset="1" stop-color="#C9B171"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#143D49" stroke-width="1" opacity=".35"/>
    </pattern>
    <style>
      .label { font: 700 17px system-ui, sans-serif; letter-spacing: 2px; fill: #F5F8FA; }
      .small { font: 500 14px system-ui, sans-serif; fill: #8FA5B0; }
      .eyebrow { font: 700 13px system-ui, sans-serif; letter-spacing: 3px; fill: #C9B171; }
      .title { font: 700 28px system-ui, sans-serif; fill: #F5F8FA; }
      .card { fill: #0E272F; stroke: #225E6A; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="20" fill="url(#canvas)"/>
  <rect width="100%" height="100%" rx="20" fill="url(#grid)"/>
  <text x="72" y="62" class="eyebrow">ARCHITECTURE</text>
  <text x="72" y="102" class="title">Explicit boundaries. Inspectable flow.</text>
  <rect x="80" y="150" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="104" y="204" class="label">CLI</text>
  <text x="104" y="238" class="small">arguments + dispatch</text>
  <path d="M358 215.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="420" y="150" width="278" height="130" rx="16" fill="#0E272F" stroke="#C9B171" stroke-width="2"/>
  <text x="444" y="204" class="label">SOURCE REGISTRY</text>
  <text x="444" y="238" class="small">authoritative source list</text>
  <path d="M698 215.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="760" y="150" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="784" y="204" class="label">SCRAPERS</text>
  <text x="784" y="238" class="small">typed source adapters</text>
  <path d="M1038 215.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="1100" y="150" width="278" height="130" rx="16" fill="#0E272F" stroke="#C9B171" stroke-width="2"/>
  <text x="1124" y="204" class="label">LEAD.FROM_RAW()</text>
  <text x="1124" y="238" class="small">normalization boundary</text>
  <path d="M1239.0 280v56H219.0" stroke="#C9B171" stroke-width="3" fill="none"/>
  <rect x="80" y="370" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="104" y="424" class="label">ENRICHMENT</text>
  <text x="104" y="458" class="small">evidence collection</text>
  <path d="M358 435.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="420" y="370" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="444" y="424" class="label">CANDIDATE SELECTION</text>
  <text x="444" y="458" class="small">provenance + confidence</text>
  <path d="M698 435.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="760" y="370" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="784" y="424" class="label">SCORING</text>
  <text x="784" y="458" class="small">documented additive rules</text>
  <path d="M1038 435.0h62" stroke="#2999A3" stroke-width="3"/>
  <rect x="1100" y="370" width="278" height="130" rx="16" fill="#0E272F" stroke="#225E6A" stroke-width="2"/>
  <text x="1124" y="424" class="label">CSV EXPORT</text>
  <text x="1124" y="458" class="small">stable local schema</text>
  <circle cx="1282" cy="215" r="6" fill="#C9B171" filter="url(#glow)"/>
  <circle cx="98" cy="435" r="6" fill="#C9B171" filter="url(#glow)"/>
</svg>
