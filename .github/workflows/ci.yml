name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI output free of ANSI escapes and ensure no test can reach a network
  # source by accident through an inherited proxy setting.
  NO_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          # One Windows run guards the console-encoding and path handling that
          # differ there; no need to matrix it across every version.
          - python-version: "3.12"
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check --output-format=github .

      - name: Formatting (ruff format)
        run: ruff format --check --diff .

      - name: Type check (mypy)
        run: mypy prospectiq

      - name: Tests
        run: pytest -v --cov=prospectiq --cov-report=term-missing -m "not network"

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          prospectiq --help
          prospectiq --version
          prospectiq sources

          # The demo must run end to end with no credentials and no network.
          prospectiq --demo

          # And it must actually have produced a CSV.
          test -n "$(find demo_output -name '*.csv' -print -quit)"

          # The module entry point must behave identically to the script.
          python -m prospectiq --version

      - name: Verify the version is declared in exactly one place
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(python -c "import prospectiq; print(prospectiq.__version__)")
          cli_version=$(prospectiq --version | awk '{print $2}')
          test "$pkg_version" = "$cli_version"
          echo "Version $pkg_version is consistent."

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install the built wheel in a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/prospectiq --version
          /tmp/fresh/bin/prospectiq --help
