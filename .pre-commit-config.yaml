# Pre-commit hooks for ProspectIQ.
#
#   pip install -e ".[dev]"
#   pre-commit install
#
# Run against everything once:  pre-commit run --all-files

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]

      # Safety net: these must never be committed. .gitignore covers them, but a
      # forced add would slip through without this.
      - id: detect-private-key
      - id: forbid-new-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^prospectiq/
        additional_dependencies:
          - types-requests
          - rich
          - httpx

  - repo: local
    hooks:
      - id: no-secrets-in-commit
        name: block .env and credential files
        entry: >-
          Refusing to commit a credential file. These belong in .gitignore.
        language: fail
        files: '(^|/)(\.env$|\.env\.[^.]*$|cookies\.(txt|json)$|proxies\.txt$|.*\.pem$|.*\.key$)'
        exclude: '^\.env\.example$'

      - id: no-exported-leads
        name: block exported lead data
        entry: >-
          Refusing to commit a lead export. Exports contain personal data and
          must stay local.
        language: fail
        files: '^(exports|demo_output)/.*\.csv$|prospectiq_leads.*\.csv$'

      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
